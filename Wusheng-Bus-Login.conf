# 武胜公交 · 登录授权抓取 0.2.5
# 配套 Scripting 武胜公交，不需要账号文件或导入口令。
# 先启用已有的 BoxJS、重写和 MITM；打开微信“武胜公交”→“我的”，刷新个人信息。
# 出现“授权已抓取”后，回 Scripting → 圈 X 抓取登录 → 从圈 X 导入登录。
# 只保存该查询的 Authorization 与 userId 到圈 X 本地；验证成功后关闭本订阅。
# 不拦截微信通用通信、手机号授权正文、充值、支付或乘车码请求。
hostname = wsapi.wskyzx.com:26110

^https:\/\/wsapi\.wskyzx\.com:26110\/api\/WechatInfo\/GetUserInfo(?:\?|$) url script-request-body https://raw.githubusercontent.com/zxwzywzy/cmcc/main/scripts/wusheng_bus_login-v0.2.5.js
