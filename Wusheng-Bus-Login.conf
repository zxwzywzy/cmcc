# 武胜公交 · 登录授权抓取 0.2.6
# 配套 Scripting 武胜公交，不需要账号文件或导入口令。
# 先启用已有的 BoxJS、重写和 MITM；彻底关闭后重开微信“武胜公交”，点击“乘车码”或“消费记录”。
# 出现“授权已抓取”后，回 Scripting → 圈 X 抓取登录 → 从圈 X 导入登录。
# 只保存 Authorization 与 userId 到圈 X 本地；验证成功后关闭本订阅。
# 只读乘车码请求头及用户标识，不读取码图响应；登录只读成功响应，不读手机号授权正文。
# MITM 使用 TLS 主机名（不带端口）；规则仍严格限制到业务端口 26110。
hostname = wsapi.wskyzx.com

^https:\/\/wsapi\.wskyzx\.com:26110\/api\/(?:WechatInfo\/GetUserInfo|AppBusiness\/(?:GetPayRrcode|GetConsumedAndRechargeRecord))(?:\?|$) url script-request-body https://raw.githubusercontent.com/zxwzywzy/cmcc/main/scripts/wusheng_bus_login-v0.2.6.js
^https:\/\/wsapi\.wskyzx\.com:26110\/api\/WechatInfo\/GetPhoneNumber(?:\?|$) url script-response-body https://raw.githubusercontent.com/zxwzywzy/cmcc/main/scripts/wusheng_bus_login-v0.2.6.js
